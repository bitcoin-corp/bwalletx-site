<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-themes-services</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Share card for bwalletx.com/themes/custom/services. Sibling of og-themes-orderform.png. Render at 1200x630. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background-color: #f7f6f2; color: #111;
    background-image: linear-gradient(rgba(17,17,17,.055) 1px, transparent 1px), linear-gradient(90deg, rgba(17,17,17,.055) 1px, transparent 1px);
    background-size: 40px 40px; font-family: 'Space Grotesk', sans-serif; }
  .eye { position: absolute; left: 64px; top: 58px; font: 500 19px/1 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; }
  h1 { position: absolute; left: 62px; top: 96px; margin: 0; font: 700 76px/.98 'Space Grotesk'; letter-spacing: -.045em; width: 640px; }
  .list { position: absolute; left: 64px; top: 300px; width: 562px; background: #fff; border: 2px solid #111; }
  .row { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 18px; border-bottom: 1px solid #111; font: 600 22px/1 'Space Grotesk'; letter-spacing: -.01em; }
  .row:last-child { border-bottom: 0; }
  .pill { font: 500 13px/1 'IBM Plex Mono', monospace; letter-spacing: .1em; text-transform: uppercase; padding: 6px 10px; background: #111; color: #f7f6f2; }
  .pill.soon { background: #f7f6f2; color: #111; box-shadow: inset 0 0 0 1.5px #111; }
  .url { position: absolute; right: 70px; bottom: 40px; font: 500 20px/1 'IBM Plex Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
  .card { position: absolute; left: 690px; top: 140px; width: 440px; height: 278px; border-radius: 22px; transform: rotate(-4deg);
    background: radial-gradient(circle at 82% 14%, rgba(255,255,255,.22), transparent 42%), linear-gradient(135deg, #1d2f6b 0%, #0e1a40 70%);
    border: 2px solid #0a1230; box-shadow: 0 28px 50px -18px rgba(17,17,17,.45); color: #f3efe4; }
  .card .nm { position: absolute; left: 30px; top: 34px; font: 600 24px/1 'Space Grotesk'; letter-spacing: -.01em; }
  .card .mk { position: absolute; right: 30px; top: 26px; width: 34px; height: 40px; }
  .card .bal { position: absolute; left: 30px; top: 96px; font: 700 60px/1 'Space Grotesk'; letter-spacing: -.04em; }
  .card .dom { position: absolute; left: 32px; bottom: 30px; font: 500 17px/1 'IBM Plex Mono', monospace; letter-spacing: .02em; color: #c9c3b3; }
  .card .tag { position: absolute; right: 26px; bottom: 26px; font: 700 17px/1 'Space Grotesk'; padding: 9px 14px; border-radius: 18px; background: #e9c46a; color: #111; }
</style>
</head>
<body>
  <div class="eye">bWalletX &middot; Branded wallets</div>
  <h1>Services for your branded wallet.</h1>
  <div class="list">
    <div class="row"><span>Rooms and support</span><span class="pill">Live</span></div>
    <div class="row"><span>Site care</span><span class="pill">Live</span></div>
    <div class="row"><span>Your own domain</span><span class="pill">Live</span></div>
    <div class="row"><span>Company workspace</span><span class="pill soon">In build</span></div>
  </div>
  <div class="card">
    <span class="nm">Northgate wallet</span>
    <svg class="mk" viewBox="0 0 34 40" fill="none" stroke="#f3efe4" stroke-width="3.2" stroke-linecap="round"><path d="M6 3c3 1 4 4 4 9v14"/><circle cx="19" cy="26" r="9"/></svg>
    <span class="bal">$2,480.00</span>
    <span class="dom">wallet.yourbrand.com</span>
    <span class="tag">Your services</span>
  </div>
  <div class="url">bwalletx.com/themes/custom/services</div>
</body>
</html>
