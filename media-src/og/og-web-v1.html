<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
.og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:'Space Grotesk',sans-serif;color:#fff;background:radial-gradient(circle at 78% 45%,rgba(245,184,0,.28),transparent 42%),#000}
.mark{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:14px}
.mark img{width:50px;filter:drop-shadow(0 0 22px rgba(245,184,0,.65))}
.mark span{font-weight:700;font-size:34px;letter-spacing:-1px}.gold{color:#F5B800}
h1{position:absolute;left:72px;top:130px;width:580px;margin:0;font-weight:700;font-size:72px;line-height:1.02;letter-spacing:-2.5px;background:linear-gradient(180deg,#FFD84D,#E8A100);-webkit-background-clip:text;color:transparent}
.line{position:absolute;left:72px;top:390px;width:560px;font-weight:600;font-size:32px;line-height:1.25}
.url{position:absolute;left:72px;bottom:44px;font-size:24px;color:#c9ced8}.url b{color:#fff}
.win{position:absolute;right:56px;top:84px;width:450px;background:#0c0d10;border:1px solid #F5B80066;border-radius:18px;overflow:hidden;box-shadow:0 0 70px rgba(245,184,0,.3);transform:rotate(2deg)}
.bar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:#17181c;border-bottom:1px solid #ffffff14}
.dot{width:12px;height:12px;border-radius:50%;background:#3a3c42}
.addr{flex:1;margin-left:10px;background:#0c0d10;border-radius:8px;padding:6px 12px;font:500 16px 'IBM Plex Sans';color:#c9ced8}
.addr b{color:#fff;font-weight:600}
.body{padding:22px 26px 26px}
.wm{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px}.wm img{width:28px}
.ex{display:inline-block;margin-left:auto;font:600 13px 'IBM Plex Sans';letter-spacing:.12em;color:#9aa1ad;border:1px solid #ffffff30;border-radius:999px;padding:3px 10px}
.bal{margin:22px 0 4px;font-size:46px;font-weight:700;letter-spacing:-1px}.bal small{font-size:22px;color:#9aa1ad;margin-left:6px}
.sub{font:400 16px 'IBM Plex Sans';color:#9aa1ad}
.btns{display:flex;gap:12px;margin-top:22px}
.btns span{flex:1;text-align:center;padding:12px 0;border-radius:12px;font-weight:600;font-size:19px;border:1px solid #ffffff22}
.btns span.p{background:#F5B800;color:#1a1300;border-color:#F5B800}
.keys{margin-top:18px;text-align:center;border:1.5px dashed #F5B80088;border-radius:12px;padding:9px;color:#F5B800;font-weight:600;font-size:17px}
</style></head><body><div class="og">
<div class="mark"><img src="http://localhost:8767/logo.svg"><span>bWallet<span class="gold">X</span></span></div>
<h1>bWalletX in your browser. No install.</h1>
<div class="line">Restore with your 12 words, or start a new wallet.</div>
<div class="win">
<div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="addr">https://<b>web.bwalletx.com</b></span></div>
<div class="body">
<div class="wm"><img src="http://localhost:8767/logo.svg"><span>bWallet<span class="gold">X</span></span><span class="ex">EXAMPLE</span></div>
<div class="bal">0.25<small>BSV</small></div>
<div class="sub">Same wallet as the app</div>
<div class="btns"><span class="p">Receive</span><span>Send</span></div>
<div class="keys">Your keys stay in your browser</div>
</div></div>
<div class="url"><b>bwalletx.com/web</b> · beta</div>
</div></body></html>
