<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
.og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:'Space Grotesk',sans-serif;color:#fff;background:radial-gradient(circle at 80% 52%,rgba(242,194,48,.26),transparent 40%),#000}
.mark{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:14px;z-index:3}
.mark img{width:50px;filter:drop-shadow(0 0 22px rgba(242,194,48,.65))}
.mark span{font-weight:700;font-size:34px;letter-spacing:-1px}.gold{color:#F2C230}
h1{position:absolute;left:72px;top:150px;width:560px;margin:0;font-weight:700;font-size:76px;line-height:1.02;letter-spacing:-2.5px;background:linear-gradient(180deg,#F2C230,#E6B020);-webkit-background-clip:text;color:transparent;z-index:3}
.line{position:absolute;left:72px;top:330px;width:470px;font-weight:600;font-size:30px;line-height:1.25;z-index:3}
.url{position:absolute;left:72px;bottom:44px;font-size:24px;color:#c9ced8;z-index:3}.url b{color:#fff}
.field{position:absolute;left:560px;top:30px;width:420px;height:570px;overflow:hidden;display:grid;grid-template-columns:repeat(8,44px);gap:9px;align-content:center;z-index:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.field img{width:44px;height:44px;border-radius:50%;background:#111}
.flow{position:absolute;left:560px;top:0;width:520px;height:630px;z-index:1;background:linear-gradient(90deg,rgba(0,0,0,.85),transparent 35%,transparent 65%,rgba(0,0,0,.2))}
.arrow{position:absolute;left:870px;top:282px;font-size:44px;text-shadow:0 0 18px #000;color:#F2C230;z-index:2}
.bsv{position:absolute;right:56px;top:210px;width:210px;height:210px;border-radius:50%;background:linear-gradient(180deg,#F2C230,#E6B020);display:grid;place-items:center;box-shadow:0 0 80px rgba(242,194,48,.5),inset 0 -8px 0 rgba(0,0,0,.15);z-index:2}
.bsv span{font-weight:700;font-size:64px;color:#000;letter-spacing:-2px}
</style></head><body><div class="og">
<div class="mark"><img src="/logo.svg"><span>bWallet<span class="gold">X</span></span></div>
<h1>Swap 1,000+ coins into BSV</h1>
<div class="line">Straight into your own bWalletX wallet</div>
<div class="field" id="f"></div><div class="flow"></div>
<div class="arrow">&#10095;&#10095;</div><div class="bsv"><span>BSV</span></div>
<div class="url"><b>bwalletx.com/swap</b> · Run by ChangeNOW</div>
</div>
<script>
fetch('/swap-coins.json').then(r=>r.json()).then(d=>{var f=document.getElementById('f');
d.coins.filter(c=>c.img).slice(0,88).forEach(c=>{var i=new Image();i.src=c.img;f.appendChild(i)})});
</script></body></html>
