<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
.og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:'Space Grotesk',sans-serif;color:#fff;background:radial-gradient(circle at 76% 50%,rgba(245,184,0,.24),transparent 46%),#000}
.mark{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:14px}
.mark img{width:50px;filter:drop-shadow(0 0 22px rgba(245,184,0,.65))}
.mark span{font-weight:700;font-size:34px;letter-spacing:-1px}.gold{color:#F5B800}
h1{position:absolute;left:72px;top:140px;width:520px;margin:0;font-weight:700;font-size:74px;line-height:1.02;letter-spacing:-2.5px;background:linear-gradient(180deg,#FFD84D,#E8A100);-webkit-background-clip:text;color:transparent}
.line{position:absolute;left:72px;top:340px;width:480px;font-weight:600;font-size:30px;line-height:1.25}
.url{position:absolute;left:72px;bottom:44px;font-size:24px;color:#c9ced8}.url b{color:#fff}
.grid{position:absolute;right:56px;top:55px;display:grid;grid-template-columns:repeat(3,160px);gap:18px;transform:rotate(2deg)}
.grid figure{margin:0;text-align:center;font-size:15px;color:#c9ced8}
.grid canvas{width:160px;height:160px;border-radius:50%;display:block;box-shadow:0 0 30px rgba(245,184,0,.22);border:1px solid #F5B80055}
.grid figcaption{margin-top:6px}
</style></head><body><div class="og">
<div class="mark"><img src="http://localhost:8767/logo.svg"><span>bWallet<span class="gold">X</span></span></div>
<h1>Every name gets a bAvatar</h1>
<div class="line">Drawn from your Bitcoin name. Same name, same picture, everywhere.</div>
<div class="grid" id="g"></div>
<div class="url"><b>bwalletx.com/bavatars</b> · Pick your style</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="http://localhost:8767/bavatars.js"></script>
<script>
[['bloom','b0asex'],['deco','satchmo'],['kintsugi','bwalletx'],['sigil','peyton'],['qr','b0asex'],['orbit','bswan']].forEach(function(p){
  var st=bAvatars.STYLES.find(function(s){return s.id===p[0]});
  var f=document.createElement('figure'),c=document.createElement('canvas');c.width=c.height=320;
  f.appendChild(c);var cap=document.createElement('figcaption');cap.textContent=st.name+' · $'+p[1];f.appendChild(cap);
  document.getElementById('g').appendChild(f);bAvatars.draw(c.getContext('2d'),320,p[0],p[1]);
});
</script></body></html>
