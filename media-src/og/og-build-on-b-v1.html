<!doctype html>

<html lang="en">
  <head>

    <title>og build-on-b v1</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #120d2e; }
      .card { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: 'Space Grotesk', sans-serif; color: #fff;

      .l { position: absolute; z-index: 2; left: 64px; top: 56px; width: 560px; height: 518px; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; }
      .brand img { width: 30px; height: 40px; }

      .eb { margin-top: 64px; font-weight: 700; font-size: 19px; letter-spacing: .2em; color: #FFD24D; }

      .hero::before { content: ''; position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(circle, rgba(255,255,255,.2) 1.5px, transparent 2px); background-size: 24px 24px; }
      .hero svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>

        </svg>
      </div>
    </div>
    <script>
      var PB = ['.X....', 'XX....', 'XX....', 'XXXXX.', 'XX..XX', 'XX..XX', 'XX..XX', '.XXXX.'], c = 40, x0 = 250 - 3 * c, y0 = 462 - 8 * c, h = '';
      for (var r = 0; r < 8; r++) for (var k = 0; k < 6; k++) if (PB[r][k] === 'X') h += '<use href="#blk" x="' + (x0 + k * c) + '" y="' + (y0 + r * c) + '" width="' + c + '" height="' + c + '" />';
      document.getElementById('pb').innerHTML = h;
