<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
.og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:'Space Grotesk',sans-serif;color:#fff;background:radial-gradient(circle at 78% 45%,rgba(245,184,0,.28),transparent 42%),#000}
.mark{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:14px}
.mark img{width:50px;filter:drop-shadow(0 0 22px rgba(245,184,0,.65))}
.mark span{font-weight:700;font-size:34px;letter-spacing:-1px}.gold{color:#F5B800}
h1{position:absolute;left:72px;top:130px;width:600px;margin:0;font-weight:700;font-size:76px;line-height:1.02;letter-spacing:-2.5px;background:linear-gradient(180deg,#FFD84D,#E8A100);-webkit-background-clip:text;color:transparent}
.line{position:absolute;left:72px;top:320px;width:560px;font-weight:600;font-size:34px;line-height:1.25}
.url{position:absolute;left:72px;bottom:44px;font-size:24px;color:#c9ced8}.url b{color:#fff}
.card{position:absolute;right:64px;top:70px;width:420px;background:#0c0d10ee;border:1px solid #F5B80066;border-radius:24px;padding:24px 26px;box-shadow:0 0 70px rgba(245,184,0,.3);transform:rotate(2deg)}
.card h3{font-size:17px;color:#F5B800;letter-spacing:.1em;margin:0 0 8px}
.r{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-top:1px solid #ffffff18;font-size:22px}
.r small{display:block;color:#9aa1ad;font-size:15px;font-family:'IBM Plex Sans'}
.lic{font-weight:700;color:#1a1300;background:#F5B800;border-radius:999px;padding:5px 14px;font-size:18px}
.tm{margin-top:14px;text-align:center;border:1.5px dashed #F5B80088;border-radius:14px;padding:10px;color:#F5B800;font-weight:600;font-size:17px}
</style></head><body><div class="og">
<div class="mark"><img src="http://localhost:8767/logo.svg"><span>bWallet<span class="gold">X</span></span></div>

<div class="line">Your keys, your coins, code anyone can read.</div>
<div class="card"><h3>WHAT'S OPEN</h3>
<div class="r"><span>The wallet<small>github.com/bitcoin-corp/bwallet</small></span><span class="lic">MIT</span></div>
<div class="r"><span>The CLI<small>github.com/b0ase/bwalletx-cli</small></span><span class="lic">MIT</span></div>

<div class="url"><b>bwalletx.com/open-source</b> · Read the code today</div>
</div></body></html>
