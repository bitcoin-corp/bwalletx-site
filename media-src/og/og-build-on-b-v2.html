<!doctype html>
<!-- Source for /og-build-on-b-v2.png (1200x630). Serve the repo root, open /media-src/og/og-build-on-b-v2.html at 1200x630, screenshot.
     v2 (8 Nov 2026): our real bBots (the Bubble shape from brand/bbot/) instead of legged robots, and a signed contract card. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>og build-on-b v2</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;display=swap" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #120d2e; }
      .card { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: 'Space Grotesk', sans-serif; color: #fff;
        background: radial-gradient(ellipse 70% 90% at 78% 50%, #4a35b0 0%, #2a1e72 40%, #120d2e 78%); }
      .card::before { content: ''; position: absolute; inset: 0; opacity: .45; background-image: radial-gradient(circle, rgba(255,255,255,.18) 1.5px, transparent 2px); background-size: 28px 28px; }
      .l { position: absolute; z-index: 2; left: 64px; top: 56px; width: 560px; height: 518px; display: flex; flex-direction: column; }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 30px; letter-spacing: -0.02em; }
      .brand img { width: 30px; height: 40px; }
      .brand .x { color: #FFD24D; }
      .eb { margin-top: 60px; font-weight: 700; font-size: 19px; letter-spacing: .2em; color: #FFD24D; }
      h1 { margin: 14px 0 0; display: flex; align-items: flex-start; gap: 0 .2em; font-weight: 700; font-size: 128px; line-height: .95; letter-spacing: -0.05em; }
      h1 img { height: .86em; margin-top: .06em; filter: drop-shadow(0 0 30px rgba(245,184,0,.55)); }
      .meta { margin-top: 24px; font-weight: 500; font-size: 25px; line-height: 1.35; color: #e9e4f7; }
      .row { margin-top: auto; display: flex; align-items: center; gap: 22px; }
      .pill { padding: 15px 30px; border-radius: 999px; background: linear-gradient(180deg, #ffe58a, #f5b800); color: #111; font-weight: 700; font-size: 25px; box-shadow: 0 5px 0 #8a6400; }
      .url { font-weight: 500; font-size: 21px; color: #c9c2e6; }
      .hero { position: absolute; z-index: 2; right: 56px; top: 56px; width: 500px; height: 518px; border-radius: 28px; overflow: hidden;
        background: radial-gradient(ellipse at 50% 38%, #5a44c8, #241a63 75%); border: 2px solid rgba(255,210,77,.7); box-shadow: 0 30px 80px rgba(0,0,0,.5); }
      .hero::before { content: ''; position: absolute; inset: 0; opacity: .5; background-image: radial-gradient(circle, rgba(255,255,255,.2) 1.5px, transparent 2px); background-size: 24px 24px; }
      .hero svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="l">
        <div class="brand"><img src="/logo.svg" alt="" /><span>bWallet<span class="x">X</span></span></div>
        <div class="eb">FOR BUILDERS · BETA</div>
        <h1>Build on <img src="/logo.svg" alt="b" /></h1>
        <div class="meta">Connect · CLI and MCP · b0-x<br />Contracts in bChatX, paid in BSV</div>
        <div class="row"><span class="pill">Start building</span><span class="url">bwalletx.com/build-on-b</span></div>
      </div>
      <div class="hero">
        <svg viewBox="0 0 500 518" aria-hidden="true">
          <defs>
            <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE58A" /><stop offset=".55" stop-color="#FFD24D" /><stop offset="1" stop-color="#C98F00" /></linearGradient>
            <symbol id="blk" viewBox="0 0 26 26"><rect x="1.2" y="1.2" width="23.6" height="23.6" rx="5" fill="url(#gold)" stroke="#111" stroke-width="2.2" /><rect x="5" y="5" width="8" height="3.6" rx="1.8" fill="#fff" opacity=".6" /></symbol>
            <symbol id="fpr" viewBox="0 0 36 36"><circle cx="18" cy="18" r="16" fill="url(#gold)" stroke="#111" stroke-width="2" /><g fill="none" stroke="#5a3e00" stroke-width="1.7" stroke-linecap="round"><path d="M8.6 15.5C10.2 11.4 13.8 8.8 18 8.8s7.8 2.6 9.4 6.7" /><path d="M11.2 21.5c-.3-5 2.6-8.5 6.8-8.5s7.1 3.5 6.8 8.5" /><path d="M14.4 25.6c-.6-1.4-1-3-1-4.6 0-3 2-5 4.6-5s4.6 2 4.6 5c0 2-.4 3.6-1 5" /><path d="M18 19.6v7.6" /></g></symbol>
            <!-- bBot, Bubble shape (brand/bbot/bbot-gold.svg geometry); colours from --bm/--bd/--bl. -->
            <g id="bbody">
              <rect x="30.8" y="3" width="2.4" height="7" rx="1.2" style="fill: var(--bd)" />
              <circle cx="32" cy="3.6" r="2.8" stroke-width="1.5" style="fill: var(--bl); stroke: var(--bd)" />
              <path d="M22 9 H42 A14 14 0 0 1 56 23 V32 A14 14 0 0 1 42 46 H30 L17 57 L20 45.2 A14 14 0 0 1 8 32 V23 A14 14 0 0 1 22 9 Z" stroke-width="2.5" stroke-linejoin="round" style="fill: var(--bm); stroke: var(--bd)" />
            </g>
            <symbol id="bb" viewBox="0 0 64 64" overflow="visible"><use href="#bbody" /><rect x="19.5" y="19" width="8" height="13" rx="4" fill="#0F1013" /><circle cx="24.6" cy="23" r="1.5" fill="#fff" fill-opacity=".9" /><rect x="36.5" y="19" width="8" height="13" rx="4" fill="#0F1013" /><circle cx="41.6" cy="23" r="1.5" fill="#fff" fill-opacity=".9" /></symbol>
            <symbol id="bbw" viewBox="0 0 64 64" overflow="visible"><use href="#bbody" /><g transform="translate(2 0)"><rect x="19.5" y="19" width="8" height="13" rx="4" fill="#0F1013" /><circle cx="24.6" cy="23" r="1.5" fill="#fff" fill-opacity=".9" /><rect x="36.5" y="19" width="8" height="13" rx="4" fill="#0F1013" /><circle cx="41.6" cy="23" r="1.5" fill="#fff" fill-opacity=".9" /></g></symbol>
            <symbol id="bbd" viewBox="0 0 64 64" overflow="visible"><use href="#bbody" /><path d="M19.9 27.32 Q23.5 19.52 27.1 27.32" stroke="#0F1013" stroke-width="2.56" fill="none" stroke-linecap="round" /><path d="M36.9 27.32 Q40.5 19.52 44.1 27.32" stroke="#0F1013" stroke-width="2.56" fill="none" stroke-linecap="round" /></symbol>
          </defs>
          <ellipse cx="250" cy="472" rx="220" ry="13" fill="#000" opacity=".3" />
          <g id="pb"></g>
          <!-- A signed contract card: two signatures, two checks, a fingerprint. -->
          <g transform="rotate(-7 140 132)">
            <rect x="40" y="58" width="200" height="148" rx="14" fill="#FFFDF6" stroke="#111" stroke-width="2.5" />
            <text x="58" y="84" font-family="Space Grotesk, sans-serif" font-weight="700" font-size="11" letter-spacing="1.5" fill="#8a5a00">ONE TASK · ONE CONTRACT</text>
            <rect x="58" y="96" width="120" height="9" rx="4.5" fill="#E4DAC6" /><rect x="58" y="112" width="160" height="7" rx="3.5" fill="#EEE6D6" />
            <rect x="58" y="132" width="76" height="50" rx="8" fill="#fff" stroke="#d9cfb8" stroke-width="1.5" /><rect x="144" y="132" width="76" height="50" rx="8" fill="#fff" stroke="#d9cfb8" stroke-width="1.5" />
            <path d="M66 168 c5 -18 9 -21 11 -7 c2 9 5 7 8 -3 c2 -7 5 -7 6 1 c1 7 4 7 8 -1 c3 -5 6 -4 9 1" fill="none" stroke="#1d2a6b" stroke-width="2.4" stroke-linecap="round" />
            <path d="M152 166 c8 -2 11 -20 15 -15 c4 4 -6 20 -1 18 c5 -2 8 -12 11 -11 c3 2 0 9 4 8 c4 -1 7 -7 11 -6" fill="none" stroke="#1d2a6b" stroke-width="2.4" stroke-linecap="round" />
            <circle cx="130" cy="136" r="8" fill="#5BD69A" stroke="#111" stroke-width="1.6" /><path d="M126 136 l2.6 2.6 l5.4 -5.4" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" />
            <circle cx="216" cy="136" r="8" fill="#5BD69A" stroke="#111" stroke-width="1.6" /><path d="M212 136 l2.6 2.6 l5.4 -5.4" stroke="#111" stroke-width="2" fill="none" stroke-linecap="round" />
          </g>
          <use href="#fpr" x="214" y="176" width="48" height="48" />
          <use href="#bbd" x="372" y="48" width="84" height="84" style="--bm: #FF7A59; --bd: #B23A1E; --bl: #FFC9B8" />
          <use href="#bbw" x="30" y="364" width="120" height="120" style="--bm: #3D8BFF; --bd: #1D4FB8; --bl: #B9D6FF" />
          <use href="#bb" x="318" y="334" width="156" height="156" style="--bm: #F5B800; --bd: #8A6400; --bl: #FFE27A" />
          <use href="#blk" x="374" y="290" width="46" height="46" transform="rotate(-6 397 336)" />
          <g fill="#FFD24D"><path d="M300 150 l4 11 l11 4 l-11 4 l-4 11 l-4 -11 l-11 -4 l11 -4z" /><path d="M466 230 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z" /><path d="M44 300 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5z" /></g>
        </svg>
      </div>
    </div>
    <script>
      var PB = ['.X....', 'XX....', 'XX....', 'XXXXX.', 'XX..XX', 'XX..XX', 'XX..XX', '.XXXX.'], c = 28, x0 = 160, y0 = 472 - 8 * c, h = '';
      for (var r = 0; r < 8; r++) for (var k = 0; k < 6; k++) if (PB[r][k] === 'X') h += '<use href="#blk" x="' + (x0 + k * c) + '" y="' + (y0 + r * c) + '" width="' + c + '" height="' + c + '" />';
      document.getElementById('pb').innerHTML = h;
    </script>
  </body>
</html>
