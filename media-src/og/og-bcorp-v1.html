<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-bcorp-v1</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* Share card for bwalletx.com/bcorp (corporate type). Sibling of og-enterprise-v2.jpg. Render at 1200x630. */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; color: #f4f1e8; font-family: 'Space Grotesk', sans-serif;
    background:
      radial-gradient(520px 380px at 900px 300px, rgba(245,184,0,.16), transparent 70%),
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px) 0 0 / 40px 40px,
      #050505; }
  .mark { position: absolute; left: 72px; top: 70px; display: flex; align-items: center; gap: 16px; font: 700 30px/1 'Space Grotesk'; letter-spacing: -.01em; }
  .mark img { width: 42px; height: 38px; }
  .mark .x { color: #F5B800; }
  .eye { position: absolute; left: 74px; top: 158px; font: 700 18px/1 'Space Grotesk'; letter-spacing: .16em; color: #F5B800; }
  h1 { position: absolute; left: 70px; top: 190px; margin: 0; font: 700 88px/.98 'Space Grotesk'; letter-spacing: -.045em; width: 640px; }
  h1 em { font-style: normal; color: #F5B800; }
  .sub { position: absolute; left: 74px; top: 398px; margin: 0; width: 600px; font: 500 27px/1.35 'Space Grotesk'; color: #d8d4c8; }
  .pill { position: absolute; left: 72px; top: 470px; font: 700 24px/1 'Space Grotesk'; padding: 17px 28px; border-radius: 999px; background: #F5B800; color: #0a0a0a; }
  .url { position: absolute; left: 74px; bottom: 44px; font: 500 22px/1 'Space Grotesk'; color: #a7adb8; }
  .panel { position: absolute; left: 752px; top: 112px; width: 370px; padding: 30px 30px 18px; box-sizing: border-box; border-radius: 22px;
    background: #101114; border: 1.5px solid rgba(245,184,0,.45); box-shadow: 0 30px 60px -20px rgba(0,0,0,.8); }
  .panel .hd { font: 700 21px/1 'Space Grotesk'; letter-spacing: .06em; color: #F5B800; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; align-items: center; height: 60px; border-top: 1px solid rgba(255,255,255,.08); font: 500 24px/1 'Space Grotesk'; }
  .row span:last-child { color: #F5B800; font-weight: 700; }
  .ldn { position: absolute; right: 78px; bottom: 44px; font: 700 18px/1 'Space Grotesk'; letter-spacing: .16em; color: #F5B800; }
</style>
</head>
<body>
  <div class="mark"><img src="../../logo.svg" alt=""><span>bWallet<span class="x">X</span></span></div>
  <div class="eye">THE COMPANY BEHIND BWALLETX</div>
  <h1>The Bitcoin <em>Corporation.</em></h1>
  <p class="sub">We make bWalletX and the b family of apps.</p>
  <div class="pill">Work with us</div>
  <div class="url">bwalletx.com/bcorp</div>
  <div class="panel">
    <div class="hd">THE COMPANY</div>
    <div class="row"><span>What we make</span><span>&rarr;</span></div>
    <div class="row"><span>Work with us</span><span>&rarr;</span></div>
    <div class="row"><span>Investors</span><span>&rarr;</span></div>
    <div class="row"><span>Contact</span><span>&rarr;</span></div>
  </div>
  <div class="ldn">LONDON</div>
</body>
</html>
