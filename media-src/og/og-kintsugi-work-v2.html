<!doctype html><html><head><meta charset="utf-8">
<!--
  Share card for bwalletx.com/kintsugi/work (og-kintsugi-work-v2.png). Replaces og-kintsugi-work-v1.png, which showed an hourly
  rate (withdrawn: CEO ruling 8 Nov 2026). Figures are from data/kintsugi-log.json (153 items, 486 wall-clock hours, 3-30 Oct 2026)
  and data/kintsugi-stamps.json (153 contracts stamped on chain). Render: serve the site root, open at 1200x630, screenshot.
-->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
.og{position:relative;width:1200px;height:630px;overflow:hidden;font-family:'Space Grotesk',sans-serif;color:#fff;background:radial-gradient(circle at 78% 45%,rgba(245,184,0,.28),transparent 42%),#000}
.mark{position:absolute;left:72px;top:56px;display:flex;align-items:center;gap:14px}
.mark img{width:50px;filter:drop-shadow(0 0 22px rgba(245,184,0,.65))}
.mark span{font-weight:700;font-size:34px;letter-spacing:-1px}.gold{color:#F5B800}
h1{position:absolute;left:72px;top:130px;width:560px;margin:0;font-weight:700;font-size:76px;line-height:1.02;letter-spacing:-2.5px;background:linear-gradient(180deg,#FFD84D,#E8A100);-webkit-background-clip:text;color:transparent}
.line{position:absolute;left:72px;top:316px;width:560px;font-weight:600;font-size:32px;line-height:1.25}
.pill{position:absolute;left:72px;top:440px;background:linear-gradient(180deg,#FFD84D,#E8A100);color:#1a1300;font-weight:700;font-size:22px;padding:13px 26px;border-radius:999px;box-shadow:0 8px 30px rgba(245,184,0,.3)}
.url{position:absolute;left:72px;bottom:44px;font-size:22px;color:#c9ced8;font-family:'IBM Plex Sans',sans-serif}.url b{color:#fff;font-family:'Space Grotesk',sans-serif}
.card{position:absolute;right:64px;top:84px;width:420px;background:#0c0d10ee;border:1px solid #F5B80066;border-radius:24px;padding:24px 26px;box-shadow:0 0 70px rgba(245,184,0,.3);transform:rotate(2deg)}
.card h3{font-size:17px;color:#F5B800;letter-spacing:.1em;margin:0 0 8px}
.r{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-top:1px solid #ffffff18;font-size:22px}
.r small{display:block;color:#9aa1ad;font-size:15px;font-family:'IBM Plex Sans'}
.v{font-weight:700;color:#1a1300;background:#F5B800;border-radius:999px;padding:5px 14px;font-size:19px;white-space:nowrap}
</style></head><body><div class="og">
<div class="mark"><img src="/logo.svg" alt=""><span>bWallet<span class="gold">X</span></span></div>
<h1>Kintsugi<br>work log</h1>
<div class="line">A month of work, in the open: every page, the hours, the contracts.</div>
<div class="pill">See every job</div>
<div class="card"><h3>3 &ndash; 30 OCT 2026</h3>
<div class="r"><span>Items shipped<small>pages and features</small></span><span class="v">153</span></div>
<div class="r"><span>Wall-clock hours<small>estimate, from git history</small></span><span class="v">486 h</span></div>
<div class="r"><span>Contracts<small>stamped on chain</small></span><span class="v">153</span></div>
</div>
<div class="url"><b>bwalletx.com/kintsugi/work</b> · Estimates from git history</div>
</div></body></html>
