    <canvas id="c" aria-hidden="true"></canvas>
    <main>
      <svg class="b" xmlns="http://www.w3.org/2000/svg" viewBox="-4 4 120 120" role="img" aria-label="bWalletX">
        <defs><linearGradient id="bgold" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="105"><stop offset="0" stop-color="#FFE58A"/><stop offset="0.55" stop-color="#FFD24D"/><stop offset="1" stop-color="#C98F00"/></linearGradient><mask id="bh"><rect x="-10" y="-10" width="140" height="140" fill="#fff"/><circle cx="60" cy="72" r="15" fill="#000"/></mask></defs>

    <script>
    (function () {
      const VERT = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
      const FRAG = `precision highp float;
uniform vec2 r;uniform float t;uniform float mode,dens,wid,gold,ride;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec2 h2(vec2 p){return fract(sin(vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3))))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
vec2 Q(vec2 p){return vec2(fbm(p+t*.04),fbm(p+vec2(5.2,1.3)-t*.03));}
float H(vec2 p){return fbm(p+2.2*Q(p));}
// Voronoi edge distance (F2-F1 style, proper border distance)
float vEdge(vec2 x){
  vec2 ip=floor(x),fp=fract(x);vec2 mg,mr;float md=8.;
  for(int j=-1;j<=1;j++)for(int i=-1;i<=1;i++){vec2 g=vec2(i,j);vec2 o=h2(ip+g);vec2 rr=g+o-fp;float d=dot(rr,rr);if(d<md){md=d;mr=rr;mg=g;}}
  md=8.;
  for(int j=-2;j<=2;j++)for(int i=-2;i<=2;i++){vec2 g=mg+vec2(i,j);vec2 o=h2(ip+g);vec2 rr=g+o-fp;
    if(dot(mr-rr,mr-rr)>.00001)md=min(md,dot(.5*(mr+rr),normalize(rr-mr)));}
  return md;}
void main(){
vec2 uv=(gl_FragCoord.xy-.5*r)/min(r.x,r.y);
vec2 p=uv*1.6;float e=.004;
float c=H(p);vec3 N=normalize(vec3(c-H(p+vec2(e,0)),c-H(p+vec2(0,e)),.012));
vec3 L=normalize(vec3(-.4,.6,.7));
float glass=step(1.5,mode);
float shin=mix(38.,90.,glass);
float spec=pow(max(dot(reflect(-L,N),vec3(0,0,1)),0.),shin);
float sheen=pow(max(dot(N,normalize(vec3(.3,.2,1.))),0.),mix(6.,14.,glass));
float d=length(uv);
vec3 base=mix(vec3(.014,.014,.018),vec3(.008,.008,.010),glass);
vec3 col=base+vec3(.09,.095,.115)*sheen*mix(1.,.45,glass)+vec3(.7,.71,.76)*spec*mix(.7,.9,glass);
// Kintsugi seams: cracks drawn in the surface's own warped space, so they ride and stretch with the waves
if(mode>.5){
  vec2 w=p*dens+ride*2.2*Q(p)+vec2(c*ride*1.5);
  float ed=vEdge(w);
  float vary=.55+.9*n(w*1.7+3.1);              // seams thicken and thin like real repairs
  float gap=smoothstep(.28,.42,n(w*.8+11.));    // some seams fade out, not a full net
  float wd=wid*vary;
  float seam=(1.-smoothstep(wd*.5,wd,ed))*gap;
  float halo=(1.-smoothstep(wd,wd*4.,ed))*gap;
  // gold catches the same light as the stone: brighter on the wave crests
  float glint=pow(max(dot(reflect(-L,N),vec3(0,0,1)),0.),12.);
  vec3 g1=vec3(.72,.50,.12),g2=vec3(1.,.86,.45);
  vec3 goldc=mix(g1,g2,clamp(glint*1.6+.15*sheen,0.,1.));
  col=mix(col,goldc*(.55+.9*glint),seam*gold);
  col+=vec3(.96,.70,.18)*halo*.08*gold;
}
col+=vec3(.96,.72,.0)*.10*exp(-d*d*5.)*(.6+.4*sheen);
col*=smoothstep(1.25,.25,d);
gl_FragColor=vec4(col,1.);}`;
      const el = document.getElementById('c');
      let gl = null;
      try { gl = el.getContext('webgl', { antialias: false, alpha: false }); } catch (e) {}
      if (!gl) { el.remove(); return; }
      const sh = (ty, s) => { const o = gl.createShader(ty); gl.shaderSource(o, s); gl.compileShader(o); return gl.getShaderParameter(o, gl.COMPILE_STATUS) ? o : null; };
      const vs = sh(gl.VERTEX_SHADER, VERT), fs = sh(gl.FRAGMENT_SHADER, FRAG);
      if (!vs || !fs) { el.remove(); return; }
      const pr = gl.createProgram(); gl.attachShader(pr, vs); gl.attachShader(pr, fs); gl.linkProgram(pr);
      if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { el.remove(); return; }
      gl.useProgram(pr);
      gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(pr, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      const U = k => gl.getUniformLocation(pr, k);
      // Mode 2, "Cracks + glass"
      gl.uniform1f(U('mode'), 2); gl.uniform1f(U('dens'), 2.6); gl.uniform1f(U('wid'), 0.022);
      gl.uniform1f(U('gold'), 0.85); gl.uniform1f(U('ride'), 0.7);
      document.body.classList.add('gl');
      const still = matchMedia('(prefers-reduced-motion: reduce)');
      const t0 = performance.now();
      let raf = 0;
      const draw = () => {
        gl.uniform2f(U('r'), el.width, el.height);
        gl.uniform1f(U('t'), still.matches ? 8 : 8 + (performance.now() - t0) / 1000);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      };
      const loop = () => { draw(); raf = requestAnimationFrame(loop); };
      const start = () => { cancelAnimationFrame(raf); raf = 0; if (still.matches || document.hidden) draw(); else loop(); };
      const size = () => { const s = Math.min(devicePixelRatio || 1, 2) * 0.75; el.width = innerWidth * s | 0; el.height = innerHeight * s | 0; gl.viewport(0, 0, el.width, el.height); if (!raf) draw(); };
      addEventListener('resize', size);
      document.addEventListener('visibilitychange', start);
      if (still.addEventListener) still.addEventListener('change', start);
      size(); start();
    })();
    </script>
