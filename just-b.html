    <link rel="stylesheet" href="/styles.css" />
    <style>
      /* Just b. (owner, 11 Oct 2026): calm, simple, beautiful. A black-and-gold desert, a few words. */
      body { margin: 0; background: #000; color: #f1ead9; }
      .jb-scene { position: relative; min-height: 100svh; display: flex; flex-direction: column; overflow: hidden; }
      .jb-scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 70%; }
      /* The moving desert: a slow 12 s back-and-forth loop over the still, fading in once it plays. */
      .jb-vid { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 70%; opacity: 0; transition: opacity 2s ease; }
      .jb-vid.playing { opacity: 1; }
      .jb-vid-tall { display: none; }
      @media (orientation: portrait) { .jb-vid-wide { display: none; } .jb-vid-tall { display: block; } }
      @media (prefers-reduced-motion: reduce) { .jb-vid { display: none !important; } }
      .jb-scene::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0) 40%, rgba(0, 0, 0, 0) 70%, #000 100%); }
      .jb-hero-in { position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 36vh 16px 0; text-align: center; }
      /* The advert: b safe, b happy, b peaceful, b you, each at title size, then "Just", then the b, which stays. */
      .jb-stage { position: relative; margin: 0; width: 100%; height: 1.05em; font: 700 clamp(3.2rem, 15vw, 12.5rem) / 1 var(--hf); letter-spacing: -0.045em; text-shadow: 0 6px 60px rgba(0, 0, 0, 0.6); }
      .jb-stage em { font-style: normal; color: var(--gold-hi); }
      .jb-stage .ph, .jb-stage .fin { position: absolute; left: 0; right: 0; top: 0; white-space: nowrap; }
      .jb-stage .ph { opacity: 0; filter: blur(4px); transform: translateY(0.05em); transition: opacity 2.8s ease, filter 2.8s ease, transform 2.8s ease; }
      .jb-stage .ph.on { opacity: 1; filter: blur(0); transform: none; }
      .jb-stage .l { display: inline-block; opacity: 0; filter: blur(4px); transform: translateY(0.05em); transition: opacity 2.2s cubic-bezier(0.25, 0.1, 0.25, 1), filter 2.2s ease, transform 2.2s ease; }
      .jb-stage .l.on { opacity: 1; filter: blur(0); transform: none; }
      .jb-stage .b { margin-left: 0.18em; vertical-align: top; margin-top: 0.08em; }
      .jb-stage .ph { display: flex; justify-content: center; align-items: flex-start; gap: 0.12em; }
      .jb-stage .ph em { color: #fff; }
      .jb-stage .pb { display: block; flex: none; margin-top: 0.08em; }
      .jb-stage .pb img { position: static; inset: auto; object-fit: contain; height: 0.86em; width: calc(0.86em * 0.74); max-width: none; display: block; filter: drop-shadow(0 0 30px rgba(245, 184, 0, 0.35)); }
      .jb-stage .b img { position: static; inset: auto; object-fit: contain; height: 0.86em; width: calc(0.86em * 0.74); max-width: none; display: block; filter: drop-shadow(0 0 30px rgba(245, 184, 0, 0.35)); }
      .jb-stage .b.on img { animation: glow 7s 2.4s ease-in-out infinite; }
      @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 24px rgba(245, 184, 0, 0.35)); } 50% { filter: drop-shadow(0 0 60px rgba(245, 184, 0, 0.8)); } }
      .jb-names { margin: 28px 0 0; font: 500 clamp(0.85rem, 3vw, 1rem) var(--hf); letter-spacing: 0.08em; color: #cfc6b0; opacity: 0; animation: rise 2s 1.2s ease forwards; }
      .jb-names a { color: inherit; text-decoration: none; }
      .jb-names a:hover, .jb-names a:focus-visible { color: #fff; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
      @keyframes drift { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .jb-stage .ph, .jb-stage .l { transition: none; } .jb-stage .b.on { animation: none; } }

      .jb-lines { max-width: 900px; margin: 0 auto; padding: 22vh 24px 18vh; text-align: center; }
      .jb-line { margin: 0 0 22vh; font: 700 clamp(3.2rem, 14vw, 7.5rem) / 1 var(--hf); letter-spacing: -0.04em; color: #f1ead9; }
      .jb-line:last-child { margin-bottom: 0; }
      .jb-line em { font-style: normal; color: var(--gold-hi); }
      .jb-sound { position: fixed; right: 18px; bottom: 18px; z-index: 5; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(245, 184, 0, 0.35); background: rgba(0, 0, 0, 0.45); color: #e8dcc0; font: 600 0.85rem var(--hf); letter-spacing: 0.06em; cursor: pointer; backdrop-filter: blur(6px); }
      .jb-sound:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
      .jb-sound[aria-pressed="true"] { color: var(--gold-hi); border-color: rgba(245, 184, 0, 0.7); }

      .jb-end { justify-content: center; }
      .jb-end img { object-position: center 60%; }
      .jb-end::after { background: linear-gradient(180deg, #000 0%, rgba(0, 0, 0, 0.1) 30%, rgba(0, 0, 0, 0.1) 75%, #000 100%); }
      .jb-end-in { position: relative; z-index: 1; text-align: center; padding: 0 16px; }
      .jb-end-in h2 { margin: 0 0 30px; font: 700 clamp(2.6rem, 10vw, 5rem) / 1 var(--hf); letter-spacing: -0.04em; text-shadow: 0 4px 40px rgba(0, 0, 0, 0.6); }
      .jb-go { display: inline-block; padding: 18px 40px; border-radius: 999px; background: linear-gradient(180deg, #ffd24d, #f5b800); color: #0b0a08; font: 700 1.1rem var(--hf); text-decoration: none; box-shadow: 0 14px 50px rgba(245, 184, 0, 0.35); }
      .jb-go:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
      .jb-foot { position: relative; z-index: 1; margin: 0; padding: 0 16px 22px; text-align: center; font-size: 0.75rem; color: #6a6458; }
      .jb-foot a { color: #8a8273; }
    </style>
  </head>
  <body class="jb">
    <section class="jb-scene">
      <picture><source media="(orientation: portrait)" srcset="/images/just-b-desert-hero-tall.jpg" /><img src="/images/just-b-desert-hero.jpg" alt="" width="1792" height="1008" fetchpriority="high" /></picture>
      <video class="jb-vid" src="/video/just-b-desert-loop.mp4?v=2" poster="/images/just-b-desert-hero.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
      <div class="jb-hero-in">
        <h1 class="jb-stage" aria-label="Just b">
          <span class="ph"><span class="pb"><img src="/logo.svg" alt="b" /></span><em>safe</em></span>
          <span class="ph"><span class="pb"><img src="/logo.svg" alt="b" /></span><em>peaceful</em></span>
          <span class="ph"><span class="pb"><img src="/logo.svg" alt="b" /></span><em>happy</em></span>
          <span class="fin"><span class="l w">Just</span><span class="l b"><img src="/logo.svg" alt="b" /></span></span>
        </h1>
      </div>
    </section>

    <section class="jb-lines" aria-label="Just b">
      <p class="jb-line">b <em>safe</em></p>
      <p class="jb-line">b <em>peaceful</em></p>
      <p class="jb-line">b <em>happy</em></p>
    </section>

    <section class="jb-scene jb-end">
      <picture><source media="(orientation: portrait)" srcset="/images/just-b-desert-ridge-tall.jpg" /><img src="/images/just-b-desert-ridge.jpg" alt="" width="1792" height="1008" loading="lazy" /></picture>
      <div class="jb-end-in">
        <h2>Just b</h2>
        <a class="jb-go" href="/get">Get bWalletX</a>
      </div>
    </section>
    <button type="button" class="jb-sound" id="jb-sound" aria-pressed="false" aria-label="Play ambient music">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
      <span id="jb-sound-label">Sound</span>
    </button>
    <audio id="jb-music" src="/audio/just-b-echoes-of-dust.mp3" preload="none" loop></audio>
    <p class="jb-foot">bWalletX is in beta: test with small amounts. <a href="mailto:support@bwalletx.com">support@bwalletx.com</a></p>
      <script>
      // The advert sequence: four phrases in turn, then Just b, which lingers, then the loop repeats.
      (function () {
        var ph = document.querySelectorAll('.jb-stage .ph'), w = document.querySelector('.jb-stage .w'),
          b = document.querySelector('.jb-stage .b');
        var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduce) { [w, b].forEach(function (e) { e.classList.add('on'); }); return; }
        var HOLD = 3800, GAP = 2400, LINGER = 9000, OUT = 3000;
        // Loops for as long as the page is open (and the music plays): phrases, then Just b lingers, fades, repeats.
        function run() {
          var t = 1200;
          ph.forEach(function (p) {
            setTimeout(function () { p.classList.add('on'); }, t);
            setTimeout(function () { p.classList.remove('on'); }, t + HOLD);
            t += HOLD + GAP;
          });
          setTimeout(function () { w.classList.add('on'); }, t);
          setTimeout(function () { b.classList.add('on'); }, t + 1500);
          t += 1500 + LINGER;
          setTimeout(function () { w.classList.remove('on'); b.classList.remove('on'); }, t);
          setTimeout(run, t + OUT - 1200);
        }
        run();
      })();
      // Desert video: play whichever one is visible; fade it in when frames are actually moving.
      (function () {
        document.querySelectorAll('.jb-vid').forEach(function (v) {
          v.addEventListener('playing', function () { v.classList.add('playing'); });
          if (getComputedStyle(v).display === 'none') { v.pause(); v.removeAttribute('autoplay'); v.preload = 'none'; }
        });
      })();
      // Ambient music (VexVoid, "Echoes of Dust"): off until the visitor taps Sound, then fades in.
      (function () {
        var btn = document.getElementById('jb-sound'), a = document.getElementById('jb-music'), lab = document.getElementById('jb-sound-label'), t;
        function fade(to, done) {
          clearInterval(t);
          t = setInterval(function () {
            var v = a.volume + (to > a.volume ? 0.04 : -0.04);
            if ((to > a.volume && v >= to) || (to <= a.volume && v <= to)) { a.volume = to; clearInterval(t); if (done) done(); } else a.volume = Math.max(0, Math.min(1, v));
          }, 80);
        }
        btn.addEventListener('click', function () {
          var on = btn.getAttribute('aria-pressed') !== 'true';
          btn.setAttribute('aria-pressed', String(on));
          btn.setAttribute('aria-label', on ? 'Pause ambient music' : 'Play ambient music');
          lab.textContent = on ? 'Sound on' : 'Sound';
          if (on) { a.volume = 0; a.play().then(function () { fade(0.6); }).catch(function () {}); }
          else fade(0, function () { a.pause(); });
        });
      })();
    </script>
