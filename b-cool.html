    <style>
      /* b cool (owner, 14 Oct 2026): b in the arctic with sunglasses on. The scene is its own background in light and dark. */
      html, body { margin: 0; background: #0b2a4a; }
      .bc { display: block; max-width: none; width: 100%; margin: 0; padding: 0; box-sizing: border-box; position: relative; min-height: 100svh; overflow: hidden; color: #fff; }
      .bc-scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .bc-copy { box-sizing: border-box; width: 100%; position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 9svh 16px 0; }
      .bc-copy h1 { margin: 0; font: 700 clamp(3.4rem, 14vw, 8.5rem) / 1 var(--hf, 'Space Grotesk', system-ui, sans-serif); letter-spacing: -0.045em; color: #fff; text-shadow: 0 4px 40px rgba(6, 30, 60, 0.45); }
      .bc-copy p { margin: 14px 0 26px; font: 500 clamp(1rem, 3.6vw, 1.25rem) var(--hf, system-ui, sans-serif); color: #eaf6ff; text-shadow: 0 2px 18px rgba(6, 30, 60, 0.5); }
      .bc-btn { display: inline-block; padding: 14px 28px; border-radius: 999px; background: linear-gradient(180deg, #ffe58a, #ffd24d 55%, #c98f00); color: #1a1200; font: 700 1.05rem var(--hf, system-ui, sans-serif); text-decoration: none; box-shadow: 0 8px 30px rgba(201, 143, 0, 0.45); }
      .bc-btn:hover, .bc-btn:focus-visible { filter: brightness(1.07); outline: none; box-shadow: 0 0 0 3px #fff, 0 8px 30px rgba(201, 143, 0, 0.5); }
      .bc-home { position: absolute; z-index: 3; top: 14px; left: 16px; color: #fff; font: 600 0.95rem var(--hf, system-ui, sans-serif); text-decoration: none; opacity: 0.85; }
      /* motion */
      .bob { animation: bob 4.5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-10px) rotate(1deg); } }
      .floe { animation: floe 4.5s ease-in-out infinite; }
      @keyframes floe { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
      .glint { animation: glint 5s ease-in-out infinite; }
      @keyframes glint { 0%, 70% { transform: translateX(-60px); opacity: 0; } 75% { opacity: 1; } 90%, 100% { transform: translateX(60px); opacity: 0; } }
      .aur { animation: aur 9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
      .aur.a2 { animation-duration: 13s; animation-delay: -4s; }
      .aur.a3 { animation-duration: 11s; animation-delay: -7s; }
      @keyframes aur { 0%, 100% { opacity: 0.55; transform: translateX(0) scaleY(1); } 50% { opacity: 0.95; transform: translateX(30px) scaleY(1.12); } }
      .snow { position: absolute; inset: 0; z-index: 1; pointer-events: none; width: 100%; height: 100%; }
      @media (prefers-reduced-motion: reduce) { .bob, .floe, .glint, .aur { animation: none; } .glint { opacity: 0; } .snow { display: none; } }
    </style>

  <body>
    <main class="bc">
      <svg class="bc-scene" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice" role="img" aria-label="The gold b wearing black sunglasses and a red scarf, standing on an ice floe under the northern lights">
        <defs>
          <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2a4a"/><stop offset="0.45" stop-color="#2f6f9e"/><stop offset="0.8" stop-color="#a9d8ef"/><stop offset="1" stop-color="#e6f6ff"/></linearGradient>
          <linearGradient id="au1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5df2c0" stop-opacity="0"/><stop offset="0.5" stop-color="#5df2c0" stop-opacity="0.75"/><stop offset="1" stop-color="#2bd6d0" stop-opacity="0"/></linearGradient>
          <linearGradient id="au2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48cff" stop-opacity="0"/><stop offset="0.5" stop-color="#9b7bff" stop-opacity="0.6"/><stop offset="1" stop-color="#4fd1c5" stop-opacity="0"/></linearGradient>
          <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f86b5"/><stop offset="1" stop-color="#0f3a63"/></linearGradient>
          <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfeaf8"/></linearGradient>
          <linearGradient id="iceside" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ee"/><stop offset="1" stop-color="#3f93c4"/></linearGradient>
          <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4fbff"/><stop offset="1" stop-color="#9ccbe6"/></linearGradient>
          <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="12" x2="0" y2="105"><stop offset="0" stop-color="#FFE58A"/><stop offset="0.55" stop-color="#FFD24D"/><stop offset="1" stop-color="#C98F00"/></linearGradient>
          <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2f3a"/><stop offset="1" stop-color="#05070a"/></linearGradient>
          <mask id="hole"><rect x="0" y="0" width="140" height="140" fill="#fff"/><circle cx="60" cy="72" r="15" fill="#000"/></mask>
          <clipPath id="lensclip"><path d="M30 55 h26 q2 0 2 2 v6 q-1 11 -14 11 q-13 0 -14 -11 v-6 q0 -2 2 -2z M64 55 h26 q2 0 2 2 v6 q-1 11 -14 11 q-13 0 -14 -11 v-6 q0 -2 2 -2z"/></clipPath>
          <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
          <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd24d" stop-opacity="0.35"/><stop offset="1" stop-color="#ffd24d" stop-opacity="0"/></radialGradient>
        </defs>
        <rect width="1200" height="800" fill="url(#sky)"/>
        <!-- stars -->
        <g fill="#fff" opacity="0.7"><circle cx="90" cy="60" r="1.6"/><circle cx="240" cy="120" r="1.2"/><circle cx="410" cy="40" r="1.4"/><circle cx="690" cy="90" r="1.1"/><circle cx="880" cy="50" r="1.6"/><circle cx="1050" cy="130" r="1.3"/><circle cx="1150" cy="40" r="1.1"/><circle cx="560" cy="150" r="1"/><circle cx="330" cy="200" r="1"/><circle cx="980" cy="210" r="1"/></g>
        <!-- aurora -->
        <g filter="url(#soft)">
          <path class="aur" d="M-50 210 C 150 120, 300 300, 520 190 S 900 110, 1250 230 L 1250 330 C 900 220, 760 300, 520 300 S 150 230, -50 320Z" fill="url(#au1)"/>
          <path class="aur a2" d="M-50 120 C 200 60, 380 200, 640 120 S 1000 60, 1250 150 L 1250 220 C 1000 140, 820 230, 640 200 S 220 130, -50 210Z" fill="url(#au2)"/>
          <path class="aur a3" d="M200 280 C 400 220, 600 340, 820 260 S 1100 230, 1250 290 L 1250 340 C 1050 300, 900 340, 820 330 S 450 290, 200 350Z" fill="url(#au1)" opacity="0.6"/>
        </g>
        <!-- far peaks -->
        <path d="M0 560 L120 430 L190 490 L300 380 L420 500 L520 440 L610 520 L0 520Z" fill="#cfe6f4" opacity="0.7"/>
        <path d="M560 560 L700 420 L780 480 L880 360 L1010 490 L1100 430 L1200 500 L1200 560Z" fill="#cfe6f4" opacity="0.7"/>
        <path d="M-20 580 L90 470 L160 520 L260 420 L360 520 L440 480 L560 580Z" fill="url(#peak)"/>
        <path d="M260 420 L235 448 L252 445 L268 456 L282 440Z" fill="#fff"/>
        <path d="M640 580 L760 470 L840 520 L940 400 L1060 520 L1140 470 L1220 580Z" fill="url(#peak)"/>
        <path d="M940 400 L912 432 L930 428 L946 440 L962 426Z" fill="#fff"/>
        <!-- sea -->
        <rect y="575" width="1200" height="225" fill="url(#sea)"/>
        <g stroke="#cdeeff" stroke-width="2" stroke-linecap="round" opacity="0.35"><path d="M80 620 h70"/><path d="M300 660 h50"/><path d="M880 640 h90"/><path d="M1040 700 h60"/><path d="M180 740 h80"/><path d="M960 760 h50"/></g>
        <!-- icebergs -->
        <g><path d="M90 590 L130 545 L170 560 L200 590Z" fill="url(#ice)"/><path d="M90 590 L200 590 L185 612 L105 612Z" fill="url(#iceside)" opacity="0.8"/></g>
        <g><path d="M960 592 L1000 530 L1030 548 L1060 520 L1110 592Z" fill="url(#ice)"/><path d="M960 592 L1110 592 L1090 622 L980 622Z" fill="url(#iceside)" opacity="0.8"/></g>
        <!-- far polar bear on the right berg -->
        <path d="M1040 528 q4 -10 16 -10 h14 q6 -6 12 -2 q3 3 0 6 l-3 2 v10 h-4 v-6 h-18 v6 h-4 v-6 q-6 2 -9 0z" fill="#f7fbff" opacity="0.95"/>
        <!-- the floe and b -->
        <g class="floe">
          <ellipse cx="600" cy="700" rx="260" ry="26" fill="#0b2f52" opacity="0.35"/>
          <path d="M370 662 L420 640 L780 636 L840 660 L820 690 L380 692Z" fill="url(#ice)"/>
          <path d="M380 692 L820 690 L800 720 L410 722Z" fill="url(#iceside)"/>
          <ellipse cx="600" cy="560" rx="180" ry="150" fill="url(#halo)"/>
          <g transform="translate(600 650) scale(3.1) translate(-60 -105)">
            <g class="bob">
              <ellipse cx="60" cy="105" rx="34" ry="3" fill="#0b2f52" opacity="0.25"/>
              <g fill="url(#gold)" mask="url(#hole)"><polygon points="45,12 45,76 27,76 27,30"/><circle cx="60" cy="72" r="33"/></g>
              <!-- scarf -->
              <path d="M24 40 L48 34 L49 42 L25 48Z" fill="#e0353b"/>
              <path d="M27 46 l-7 22 l7 1 l5 -21z" fill="#c42a30"/>
              <path d="M26 41 L48 36 M26 45 L48 40" stroke="#fff" stroke-width="1" opacity="0.6"/>
              <!-- sunglasses -->
              <path d="M20 55 h80" stroke="#0a0c10" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M30 55 h26 q2 0 2 2 v6 q-1 11 -14 11 q-13 0 -14 -11 v-6 q0 -2 2 -2z M64 55 h26 q2 0 2 2 v6 q-1 11 -14 11 q-13 0 -14 -11 v-6 q0 -2 2 -2z" fill="url(#lens)" stroke="#000" stroke-width="1.2"/>
              <path d="M56 58 q4 -3 8 0" stroke="#0a0c10" stroke-width="2.4" fill="none"/>
              <g clip-path="url(#lensclip)"><rect class="glint" x="40" y="48" width="7" height="34" fill="#fff" opacity="0.8" transform="skewX(-25)"/></g>

              <path d="M68 58 h10" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>
            </g>
          </g>
        </g>
      </svg>
      <canvas class="snow" id="bc-snow" aria-hidden="true"></canvas>
      <a class="bc-home" href="/">bWalletX</a>
      <div class="bc-copy">
        <h1>b cool.</h1>
        <p>Less noise. More life. Just b.</p>
        <a class="bc-btn" href="https://web.bwalletx.com">Open bWalletX</a>
      </div>
    </main>
    <script>
      // Gentle snowfall. Off for reduced motion.
      (function () {
        if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        var c = document.getElementById('bc-snow'), x = c.getContext('2d'), f = [], w, h, d;
        function size() { d = Math.min(window.devicePixelRatio || 1, 2); w = c.clientWidth; h = c.clientHeight; c.width = w * d; c.height = h * d; x.setTransform(d, 0, 0, d, 0, 0); }
        size(); addEventListener('resize', size);
        var n = Math.round(Math.min(140, w * h / 9000));
        for (var i = 0; i < n; i++) f.push({ x: Math.random() * w, y: Math.random() * h, r: 0.8 + Math.random() * 2.2, s: 0.3 + Math.random() * 0.9, p: Math.random() * 6.28 });
        (function tick() {
          x.clearRect(0, 0, w, h); x.fillStyle = 'rgba(255,255,255,0.85)';
          for (var i = 0; i < f.length; i++) {
            var o = f[i]; o.y += o.s; o.p += 0.01; o.x += Math.sin(o.p) * 0.4;
            if (o.y > h + 4) { o.y = -4; o.x = Math.random() * w; }
            x.beginPath(); x.arc(o.x, o.y, o.r, 0, 6.283); x.fill();
          }
          requestAnimationFrame(tick);
        })();
      })();
    </script>
