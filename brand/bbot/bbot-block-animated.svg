<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" class="bbot bbot-st-idle" width="256" height="256" role="img" aria-label="Block bBot, Gold"><style>.bbot { display: inline-block; flex-shrink: 0; overflow: visible; }
.bbot-body { transform-box: fill-box; transform-origin: 50% 100%; }
.bbot-st-idle .bbot-body, .bbot-st-working .bbot-body, .bbot-st-typing .bbot-body { animation: bbot-bob 3.2s ease-in-out infinite; }
.bbot-st-done .bbot-body { animation: bbot-hop 1.6s ease-in-out infinite; }
.bbot-st-attention .bbot-body { animation: bbot-wiggle 1.5s ease-in-out infinite; }
.bbot-st-sleep .bbot-body { animation: bbot-bob 6s ease-in-out infinite; }
@keyframes bbot-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1.3px); } }
@keyframes bbot-hop { 0%, 100% { transform: translateY(0) scale(1); } 18% { transform: translateY(0) scale(1.05, .93); } 42% { transform: translateY(-5px) scale(.97, 1.04); } 66% { transform: translateY(0) scale(1.03, .97); } 80% { transform: translateY(0) scale(1); } }
@keyframes bbot-wiggle { 0%, 55%, 100% { transform: rotate(0); } 8% { transform: rotate(-7deg); } 18% { transform: rotate(6deg); } 28% { transform: rotate(-4deg); } 38% { transform: rotate(2deg); } }
.bbot-blink { transform-box: fill-box; transform-origin: center; animation: bbot-blink 5.5s ease-in-out infinite; }
.bbot-look { animation: bbot-look 2.6s ease-in-out infinite; }
@keyframes bbot-blink { 0%, 45%, 51%, 100% { transform: scaleY(1); } 48% { transform: scaleY(.1); } }
@keyframes bbot-look { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 50% { transform: translateX(0); } 75% { transform: translateX(2px); } }
.bbot-dot { animation: bbot-dot 1.1s ease-in-out infinite; }
.bbot-d2 { animation-delay: .15s; } .bbot-d3 { animation-delay: .3s; }
@keyframes bbot-dot { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-2.4px); opacity: 1; } }
.bbot-tip { animation: bbot-tip 2.4s ease-in-out infinite; }
.bbot-st-attention .bbot-tip { animation-duration: .6s; }
.bbot-st-sleep .bbot-tip { animation: none; opacity: .35; }
@keyframes bbot-tip { 50% { opacity: .3; } }
.bbot-st-working .bbot-led1, .bbot-st-typing .bbot-led1 { animation: bbot-tip .8s ease-in-out infinite; }
.bbot-st-working .bbot-led2, .bbot-st-typing .bbot-led2 { animation: bbot-tip .8s ease-in-out .4s infinite; }
.bbot-zz { animation: bbot-zz 3s ease-in-out infinite; }
.bbot-zz2 { animation-delay: 1.5s; }
@keyframes bbot-zz { 0% { opacity: 0; transform: translate(0, 2px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(4px, -7px); } }
@media (prefers-reduced-motion: reduce) { .bbot, .bbot * { animation: none !important; } }</style><g class="bbot-body"><line x1="32" y1="10" x2="32" y2="5" stroke="#8A6400" stroke-width="2" stroke-linecap="round"/><circle class="bbot-tip" cx="32" cy="3.8" r="2.6" fill="#FFE27A" stroke="#8A6400" stroke-width="1.5"/><polygon points="32,10 54,21 32,32 10,21" fill="#FFE27A" stroke="#8A6400" stroke-width="2" stroke-linejoin="round"/><polygon points="10,21 32,32 32,57 10,46" fill="#F5B800" stroke="#8A6400" stroke-width="2" stroke-linejoin="round"/><polygon points="32,32 54,21 54,46 32,57" fill="#C99400" stroke="#8A6400" stroke-width="2" stroke-linejoin="round"/><polygon points="13,29.5 29,37.5 29,47 13,39" fill="#0F1013"/><circle class="bbot-led1" cx="40" cy="38" r="1.7" fill="#FFE27A"/><circle class="bbot-led2" cx="46" cy="35" r="1.7" fill="#FFE27A"/><g transform="matrix(1 .5 0 1 0 0)"><g class="bbot-blink"><rect x="16" y="25.025" width="4.5" height="4.75" rx="1" fill="#FFE27A"/><rect x="22" y="25.025" width="4.5" height="4.75" rx="1" fill="#FFE27A"/></g></g></g></svg>
